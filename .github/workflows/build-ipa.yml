name: Build Northy IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode (latest available)
        run: |
          if ls -d /Applications/Xcode_26*.app 1>/dev/null 2>&1; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          elif ls -d /Applications/Xcode_16*.app 1>/dev/null 2>&1; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)"
          elif ls -d /Applications/Xcode_15*.app 1>/dev/null 2>&1; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_15*.app | sort -V | tail -n 1)"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Apple Signing Certificate (if secrets provided)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_APP_BASE64: ${{ secrets.PROVISION_PROFILE_APP_BASE64 }}
          PROVISION_PROFILE_TUNNEL_BASE64: ${{ secrets.PROVISION_PROFILE_TUNNEL_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$P12_PASSWORD" ]; then
            echo ">> Apple Developer secrets detected, setting up keychain..."
            PASS="${KEYCHAIN_PASSWORD:-temp_ci_keychain_123}"
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

            security create-keychain -p "$PASS" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$PASS" $KEYCHAIN_PATH

            security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH
            security set-key-partition-list -S apple-tool:,apple: -s -k "$PASS" $KEYCHAIN_PATH

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            if [ -n "$PROVISION_PROFILE_APP_BASE64" ]; then
              echo -n "$PROVISION_PROFILE_APP_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
            fi
            if [ -n "$PROVISION_PROFILE_TUNNEL_BASE64" ]; then
              echo -n "$PROVISION_PROFILE_TUNNEL_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/tunnel.mobileprovision
            fi
          else
            echo ">> No custom Apple Developer secrets provided. Using automated on-the-fly signing."
          fi

      - name: Build & Package IPA
        env:
          DEVELOPMENT_TEAM: ${{ secrets.TEAM_ID }}
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
        run: |
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Northy-v0.1.0-signed-ipa
          path: build/*.ipa
          if-no-files-found: error
