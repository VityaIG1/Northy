name: Build NothingVPN IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode (latest available)
        run: |
          if [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_26.app"
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.app"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Apple Signing Certificate (if secrets provided)
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.P12_PASSWORD != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_APP_BASE64: ${{ secrets.PROVISION_PROFILE_APP_BASE64 }}
          PROVISION_PROFILE_TUNNEL_BASE64: ${{ secrets.PROVISION_PROFILE_TUNNEL_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temp_ci_keychain_123' }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          if [ -n "$PROVISION_PROFILE_APP_BASE64" ]; then
            echo -n "$PROVISION_PROFILE_APP_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          fi
          if [ -n "$PROVISION_PROFILE_TUNNEL_BASE64" ]; then
            echo -n "$PROVISION_PROFILE_TUNNEL_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/tunnel.mobileprovision
          fi

      - name: Build & Package IPA
        env:
          DEVELOPMENT_TEAM: ${{ secrets.TEAM_ID || '' }}
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY || (secrets.BUILD_CERTIFICATE_BASE64 != '' && 'Apple Distribution' || '') }}
        run: |
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NothingVPN-v0.1.0-signed-ipa
          path: build/*.ipa
          if-no-files-found: error
