name: Northy
options:
  bundleIdPrefix: com.scrt
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: NORTHVPN99

targets:
  Northy:
    type: application
    platform: iOS
    sources:
      - path: Northy
        excludes:
          - "*.entitlements"
      - path: Shared
    dependencies:
      - target: NorthyTunnel
        embed: true
    entitlements:
      path: Northy/Northy.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scrt.north
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Northy
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  NorthyTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: NorthyTunnel
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    info:
      path: NorthyTunnel/Info.plist
    entitlements:
      path: NorthyTunnel/NorthyTunnel.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scrt.north.PacketTunnel
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
